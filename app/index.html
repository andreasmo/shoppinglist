<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Gemeinsame Einkaufsliste der Familie" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Einkaufsliste</title>
    <script>
      // Dunkles Design vor dem ersten Zeichnen setzen (kein weißes Aufblitzen).
      try {
        var t = JSON.parse(localStorage.getItem("einkauf.prefs") || "{}").theme;
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#111315");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
